# Dorico Maestro - command catalog (data-driven registry).
#
# One entry per Dorico Remote Control command. The first block is the
# complete Dorico 6 key-command catalog (340 IDs, verbatim from
# docs/dorico_command_catalog.md). The final block adds canonical
# parameterised base commands the catalog only ships in value-baked
# form. Loaded by registry.py -> spec.CommandSpec. See docs/architecture.md.
#
# status values:
#   verified  - sent over the Remote Control API and its effect confirmed.
#   untested  - not yet exercised over the API.
#   broken    - not usable over the Remote Control API: it returns
#               kUnknownCommand or produces no effect. (Some broken ids are
#               real Dorico keyboard commands the API just does not expose.)
#
# Regenerate the raw catalog with scripts/extract_catalog.ps1;
# merge new IDs from a live keycommands.json with scripts/sync_catalog.py.

