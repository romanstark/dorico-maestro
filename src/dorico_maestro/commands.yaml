  # ==== canonical parameterised base commands (not bare in keycommands.json) ====
  - id: "NoteInput.Pitch"
    category: NoteInput
    status: verified
    requires_note_input: true
    verify: note_added
    params:
      - {name: pitch, dorico: Pitch, kind: enum, enum: ["A", "B", "C", "D", "E", "F", "G"], required: true}
      - {name: octave, dorico: OctaveValue, kind: int, required: true}
    doc: "Input a pitch at the caret (letter A-G in Pitch, scientific octave in OctaveValue). Accidentals are NOT a parameter here: enter them via add_notes (which emits a NoteInput.SetAccidental pre-step) or an explicit NoteInput.SetAccidental."
  - id: "NoteInput.SetAccidental"
    category: NoteInput
    status: verified
    requires_note_input: true
    params:
      - {name: type, dorico: Type, kind: enum, enum: ["kSharp", "kFlat", "kNatural"], required: true}
    doc: "Set the accidental for the note being input. Values use Dorico's k-prefixed enum (kSharp/kFlat/kNatural)."
  - id: "Window.SwitchMode"
    category: Window
    status: verified
    params:
      - {name: mode, dorico: WindowMode, kind: enum, enum: ["kWriteMode", "kEngraveMode", "kPlayMode", "kPrintMode", "kSetupMode"], required: true}
    doc: "Switch the active window mode."
  - id: "Play.StartOrStop"
    category: Play
    status: verified
    params:
      - {name: location, dorico: PlayFromLocation, kind: enum, enum: ["kPlayhead", "kSelection", "kStartOfFlow", "kLastStartPosition"], required: true}
    doc: "Start or stop playback from the given location."
