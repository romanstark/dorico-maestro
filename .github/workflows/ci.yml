name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Linux, Windows, and macOS on purpose. Development happens on Windows,
    # so a Linux-only matrix cannot see Windows issues, while macOS and Linux
    # catch POSIX-specific file permissions and path conventions.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src scripts tests
      - name: Types (pyright)
        # Paths, includes and the interpreter all come from [tool.pyright] in
        # pyproject.toml, so this runs the same check a contributor's editor does.
        run: pyright
      - name: Types (pyrefly)
        # Enforces strict typing rules including unnecessary-type-conversion configured
        # in [tool.pyrefly] in pyproject.toml.
        run: pyrefly check
      - name: Test (pytest)
        run: pytest -q
