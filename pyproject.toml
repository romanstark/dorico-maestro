[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dorico-maestro"
version = "0.1.0"
description = "An AI composition partner that remote-controls Steinberg Dorico via MCP."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Roman Stark", email = "mail@romanstark.de" }]
keywords = ["dorico", "mcp", "music", "composition", "notation", "music21"]

dependencies = [
    "mcp>=1.2,<2",        # FastMCP lives in mcp.server.fastmcp; 2.0 relocated it
    "websockets>=12",
    "music21>=9.1",
    "pydantic>=2",
    "pyyaml>=6",          # commands.yaml catalog loader (registry.py)
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
dorico-maestro = "dorico_maestro.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dorico_maestro"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
